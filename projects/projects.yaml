projects:
  - date: Mar 7, 2026
    name: Stang Hacks
    tagline: >-
      Ride2Rider: Smart route optimization and chat platform for school transit (Winner: Best UI/UX out of 450+)
    description: >-
      At Stang Hacks, our team created **Ride2Rider**, a platform made to help
      school transportation become safer, faster, and more organized. We used the
      Google Maps API to help optimize routes and reduce traffic during school
      drop-off and pick-up times.

      The app also includes **chat and comment features** so riders can communicate
      and coordinate with each other. Our team focused a lot on making the design
      clean, simple, and easy to use. Because of our strong user interface and
      user experience, we won **Best UI/UX out of over 450 participants**.

      This project helped me learn how to build something that solves a real-world
      problem while still making sure the app is easy and enjoyable to use.
    thumbnail: /thumbnails/stang_hacks_2026.webp
    githubURL: https://github.com/ConnorSawaya/Ride2Rider
    videoURL: https://youtu.be/M6Smstte16U
    categories:
      - Hackathons
      - Programming
      - Highlights

  - date: Mar 7, 2026
    name: Lancer Hacks
    tagline: >-
      GlobalBridge Connect: Full-stack resource platform for underserved communities (2nd Place Overall)
    description: >-
      At Lancer Hacks, our team built **GlobalBridge Connect**, a website made to
      help underserved communities find important resources like food, healthcare,
      education, and jobs. Our project placed **2nd overall** at the hackathon.

      We built the frontend using **HTML, CSS, and JavaScript**, and used **Python**
      for backend search and data handling. A lot of the resource data was manually
      entered and checked so the information would be accurate and useful.

      This project taught me more about full-stack development and how to organize
      real-world information in a way that people can actually use. It also helped
      me understand how technology can be used to support communities and solve
      meaningful problems.
    thumbnail: /thumbnails/placeholder.svg
    websiteURL: https://devpost.com/software/global-bridge-connect
    categories:
      - Hackathons
      - Programming
      - Highlights

  - date: Jan 16, 2026
    name: Divergent Teams
    tagline: >-
      StockQuest: Duolingo-style stock trading education app built at Microsoft SF (4th Place Overall)
    description: >-
      At the Divergent hackathon hosted at the **Microsoft San Francisco office**,
      our team built **StockQuest**, a gamified website that teaches kids the basics
      of stock trading. Our project placed **4th overall**.

      StockQuest is designed like a learning game, where users can complete lessons,
      answer quizzes, earn XP, keep streaks, unlock badges, and practice trading with
      a fake stock market simulator. The goal was to make learning about stocks feel
      less confusing and more fun for younger users.

      For this project, we used a **React, Vite, and Tailwind CSS** frontend with a
      **Node.js and Express** backend. The app also includes features like learning
      modules, a leaderboard, fake stocks, market events, and parental controls.

      This project taught me how to build a larger full-stack app under pressure.
      It also helped me improve my skills in teamwork, fast problem-solving, user
      experience, and presenting a project clearly.
    thumbnail: /thumbnails/placeholder.svg
    githubURL: https://github.com/ConnorSawaya/StockQuest
    categories:
      - Hackathons
      - Programming
      - Highlights

  - date: Dec 14, 2025
    name: BellHacks
    tagline: >-
      Vita-Health: AI-powered product health scanner built at my first hackathon
    description: >-
      **BellHacks** was my first hackathon, held at my school, Bellarmine College
      Preparatory. Our team created **Vita-Health**, an AI-powered product health
      scanner.

      Users can scan a product barcode and instantly get a **health score** and
      information about the product. We used the **Gemini API** to analyze ingredients
      and create clear, easy-to-understand health information.

      This project was my first real experience building and presenting a project
      during a hackathon. It taught me how to turn an idea into a working app quickly,
      work with a team, and explain our project to others.
    thumbnail: /thumbnails/placeholder.svg
    githubURL: https://github.com/ConnorSawaya/Vita-Health
    categories:
      - Hackathons
      - Programming
      - Highlights
